name: sekolah_mobile
description: "Aplikasi Manajemen Sekolah - Mobile App (Android/iOS)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management & DI
  flutter_riverpod: ^2.5.1
  
  # Routing
  go_router: ^14.2.0
  
  # Networking
  dio: ^5.5.0+1
  
  # Secure Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  
  # QR Scanner (for Kartu Pelajar scan)
  mobile_scanner: ^5.1.1
  qr_flutter: ^4.1.0
  
  # UI & Styling
  google_fonts: ^6.2.1
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
